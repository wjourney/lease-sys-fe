name: Diagnose deployment host

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect registry connectivity and Docker access
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            lease-deploy@47.117.136.208 \
            'id; docker info --format "{{.ServerVersion}}" 2>&1 | head -2; curl -sS -o /dev/null -w "GHCR HTTP %{http_code} in %{time_total}s\n" --max-time 10 https://ghcr.io/v2/ || true'
